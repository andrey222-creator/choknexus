<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ChokNexus</title>
    <link rel="icon" type="image/png" href="src/assets/choknexus/favicon_choknexus.png?v=2">

    <link rel="stylesheet" href="src/css/home.css">
</head>

<body>

    <button id="btnSair" class="logout-button" type="button">
        📤Sair
    </button>
        
    <main class="home-page">

        <section class="nexus-container">

            <!-- TÍTULO CHOK NEXUS -->
            <div class="nexus-title">
                <img
                    src="src/assets/choknexus/titulo_choknexus.png"
                    alt="Chok Nexus"
                >
            </div>

            <!-- MÓDULOS -->
            <div class="modules-grid">

                <!-- LINHA 1 -->

                <button 
                    id="btnComercial"
                    class="module-button" 
                    type="button"
                    aria-label="Abrir Comercial"
                    >
                        <img
                            src="src/assets/choknexus/logo_chokcomercial.png"
                            alt="Comercial"
                        >
                </button>

                <button class="module-button" type="button">
                    <img
                        src="src/assets/choknexus/logo_chokcompras.png"
                        alt="Compras"
                    >
                </button>

                <button class="module-button" type="button">
                    <img
                        src="src/assets/choknexus/logo_chokfiscal.png"
                        alt="Fiscal"
                    >
                </button>


                <!-- LINHA 2 -->

                <button class="module-button" type="button">
                    <img
                        src="src/assets/choknexus/logo_chokcadastro.png"
                        alt="Cadastro"
                    >
                </button>

                <button class="module-button" type="button">
                    <img
                        src="src/assets/choknexus/logo_chokagendamento.png"
                        alt="Agendamento"
                    >
                </button>

                <button class="module-button" type="button">
                    <img
                        src="src/assets/choknexus/logo_choklog.png"
                        alt="Choklog"
                    >
                </button>


                <!-- LINHA 3 -->

                <button class="module-button" type="button">
                    <img
                        src="src/assets/choknexus/logo_choklojas.png"
                        alt="Lojas"
                    >
                </button>

                <button class="module-button" type="button">
                    <img
                        src="src/assets/choknexus/logo_chokperdas.png"
                        alt="Perdas e Avarias"
                    >
                </button>

                <button class="module-button" type="button">
                    <img
                        src="src/assets/choknexus/logo_chokfinanceiro.png"
                        alt="Financeiro"
                    >
                </button>

            </div>

        </section>


        <!-- MARCA CHOKDOCE -->
        <div class="company-brand">
            <img
                src="src/assets/choknexus/logo.png"
                alt="ChokDoce"
            >
        </div>

    </main>

    <script src="src/js/home.js"></script>

</body>

</html>
