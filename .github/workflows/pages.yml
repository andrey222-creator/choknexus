name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar frontend estático
        run: |
          mkdir -p _site/src
          cp index.html home.html _site/
          cp -r src/css src/js src/assets _site/src/
          touch _site/.nojekyll
          if find _site \( -name '.env*' -o -name '*.log' -o -name 'node_modules' -o -path '*/server*' \) | grep -q .; then
            echo "Arquivo proibido no artefato"; exit 1
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
