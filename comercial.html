<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Comercial | ChokNexus</title>
    <link rel="icon" type="image/png" href="src/assets/choknexus/favicon_choknexus.png?v=2">

    <link rel="stylesheet" href="src/css/comercial.css?v=20260924-carrossel1">
</head>

<body>

    <main class="comercial-page">

        <!-- =====================================
             CABEÇALHO COMERCIAL
        ====================================== -->

        <header class="comercial-header">

            <img
                class="comercial-logo"
                src="src/assets/choknexus/logo_chokcomercial.png"
                alt="Chok Comercial"
            >

            <img
                class="comercial-title"
                src="src/assets/choknexus/titulo_comercial.png"
                alt="Comercial"
            >

        </header>


        <!-- =====================================
             CONTEÚDO
        ====================================== -->

        <section class="comercial-content">


            <!-- LATERAL ESQUERDA -->

            <aside class="comercial-menu">

                <button
                    class="menu-logo-button"
                    id="btnTrade"
                    type="button"
                    aria-label="ChokDoce Trade Marketing"
                >
                    <img
                        src="src/assets/choknexus/logo_trade_nexus.png"
                        alt="ChokDoce Trade Marketing"
                    >
                </button>


                <button
                    class="menu-logo-button"
                    id="btnMetas"
                    type="button"
                    aria-label="Metas e Atingimentos"
                >
                    <img
                        src="src/assets/choknexus/logo_metas_atingimentos.png"
                        alt="Metas e Atingimentos"
                    >
                </button>


                <button
                    class="menu-logo-button"
                    id="btnLojas"
                    type="button"
                    aria-label="Lojas"
                >
                    <img
                        src="src/assets/choknexus/logo_lojas_nexus.png"
                        alt="Lojas"
                    >
                </button>

            </aside>


            <!-- CARROSSEL DOS QUADROS DO METAS -->

            <section class="panels-area">

                <div
                    id="carrosselComercial"
                    class="carrossel"
                    aria-roledescription="carrossel"
                    aria-label="Quadros Metas & Atingimentos"
                >

                    <div class="carrossel-palco">

                        <div id="carrosselSlides" class="carrossel-slides" aria-live="polite"></div>

                        <button id="carrosselPrev" class="carrossel-seta carrossel-seta-prev" type="button" aria-label="Quadro anterior">&#8249;</button>

                        <button id="carrosselNext" class="carrossel-seta carrossel-seta-next" type="button" aria-label="Próximo quadro">&#8250;</button>

                    </div>

                    <div id="carrosselDots" class="carrossel-dots"></div>

                </div>

            </section>

        </section>


        <!-- =====================================
             RODAPÉ / NAVEGAÇÃO
        ====================================== -->

        <div class="brand-chokdoce">

            <img
                src="src/assets/choknexus/logo.png"
                alt="ChokDoce"
            >

        </div>


        <button
            id="btnNexus"
            class="nexus-button"
            type="button"
            aria-label="Voltar ao ChokNexus"
        >

            <img
                src="src/assets/choknexus/logo_choknexus.png"
                alt="ChokNexus"
            >

        </button>

    </main>


    <script src="src/js/comercial.js?v=20260924-carrossel1"></script>

</body>

</html>
