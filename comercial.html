<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Comercial | ChokNexus</title>
    <link rel="icon" type="image/png" href="src/assets/choknexus/logo_choknexus.png">

    <link rel="stylesheet" href="src/css/comercial.css">
</head>

<body>

    <main class="comercial-page">

        <!-- =====================================
             CABEÇALHO COMERCIAL
        ====================================== -->

        <header class="comercial-header">

            <img
                class="comercial-logo"
                src="src/assets/choknexus/logo_chokcomercial.png"
                alt="Chok Comercial"
            >

            <img
                class="comercial-title"
                src="src/assets/choknexus/titulo_comercial.png"
                alt="Comercial"
            >

        </header>


        <!-- =====================================
             CONTEÚDO
        ====================================== -->

        <section class="comercial-content">


            <!-- LATERAL ESQUERDA -->

            <aside class="comercial-menu">

                <button
                    class="menu-logo-button"
                    id="btnMetas"
                    type="button"
                    aria-label="Metas e Atingimentos"
                >
                    <img
                        src="src/assets/choknexus/logo_metas_atingimentos.png"
                        alt="Metas e Atingimentos"
                    >
                </button>


                <button
                    class="menu-logo-button"
                    id="btnTrade"
                    type="button"
                    aria-label="ChokDoce Trade Marketing"
                >
                    <img
                        src="src/assets/choknexus/logo_trade_nexus.png"
                        alt="ChokDoce Trade Marketing"
                    >
                </button>

            </aside>


            <!-- PAINÉIS -->

            <section class="panels-area">

                <!--
                    PAINEL SUPERIOR
                    Será alimentado posteriormente.
                -->
                <div
                    id="painelMetas"
                    class="dashboard-panel dashboard-panel-top"
                ></div>


                <!--
                    PAINEL INFERIOR
                    Será alimentado posteriormente.
                -->
                <div
                    id="painelTrade"
                    class="dashboard-panel dashboard-panel-bottom"
                ></div>

            </section>

        </section>


        <!-- =====================================
             RODAPÉ / NAVEGAÇÃO
        ====================================== -->

        <div class="brand-chokdoce">

            <img
                src="src/assets/choknexus/logo.png"
                alt="ChokDoce"
            >

        </div>


        <button
            id="btnNexus"
            class="nexus-button"
            type="button"
            aria-label="Voltar ao ChokNexus"
        >

            <img
                src="src/assets/choknexus/logo_choknexus.png"
                alt="ChokNexus"
            >

        </button>

    </main>


    <script src="src/js/comercial.js"></script>

</body>

</html>
